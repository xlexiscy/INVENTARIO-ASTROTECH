<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INVENTARIO ASTRO TECH</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --navy: #1b365d;
      --slate: #2c5282;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --green-bg: #dcfce7;
      --green-tx: #166534;
      --yellow-bg: #fef9c3;
      --yellow-tx: #854d0e;
      --red-bg: #fee2e2;
      --red-tx: #991b1b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 72px; }
    header { background: var(--navy); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 20; }
    header h1 { margin: 0; font-size: 1.1rem; }
    header small { color: #cbd5e1; font-size: 0.78rem; }
    .container { max-width: 900px; margin: 14px auto; padding: 0 12px; }
    .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    input, select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.95rem; }
    button { background: var(--slate); color: #fff; border: none; font-weight: 600; cursor: pointer; }
    button:hover { background: var(--navy); }
    button.sec { background: #e2e8f0; color: var(--text); }
    button.ok { background: #15803d; }
    button.warn { background: #b45309; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .b-ok { background: var(--green-bg); color: var(--green-tx); }
    .b-low { background: var(--yellow-bg); color: var(--yellow-tx); }
    .b-out { background: var(--red-bg); color: var(--red-tx); }
    .item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
    .item:last-child { border-bottom: none; }
    .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .kpi { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .kpi span { font-size: 0.75rem; color: var(--muted); display: block; }
    .kpi strong { font-size: 1.25rem; color: var(--navy); }
    nav.bottom { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #cbd5e1; display: grid; grid-template-columns: repeat(3, 1fr); z-index: 30; }
    nav.bottom button { background: none; color: var(--muted); border-radius: 0; padding: 10px 4px; font-size: 0.8rem; }
    nav.bottom button.active { color: var(--navy); border-top: 3px solid var(--navy); font-weight: 700; }
    .tab { display: none; }
    .tab.active { display: block; }
    #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-top: 10px; }
    .status { font-size: 0.8rem; margin-top: 6px; color: var(--slate); font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>INVENTARIO ASTRO TECH</h1>
    <small id="syncStatus">Listo para sincronizar</small>
  </header>

  <div class="container">
    <!-- PESTAÑA 1: ESCÁNER Y VENTA RÁPIDA -->
    <section id="tab-scan" class="tab active">
      <div class="card">
        <label>Escanear o escribir Código / Barras</label>
        <div style="display:flex; gap:8px;">
          <input id="scanCode" type="text" placeholder="Ej: 7501234567890 o ACC-002" />
          <button style="width:auto; white-space:nowrap;" onclick="buscarCodigo()">Buscar</button>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="ok" onclick="iniciarCamara()">Activar Cámara</button>
          <button class="sec" onclick="detenerCamara()">Detener</button>
          <button class="sec" onclick="cargarNube()">Sincronizar</button>
        </div>
        <div id="reader"></div>
        <div id="scanResultado" class="status"></div>
      </div>

      <div id="boxExistente" class="card" style="display:none;">
        <h3 id="exNombre" style="margin:0 0 6px 0;"></h3>
        <p id="exInfo" style="margin:0 0 10px 0; color:var(--muted); font-size:0.9rem;"></p>
        <div class="row">
          <div>
            <label>Cantidad</label>
            <input id="exCant" type="number" min="1" value="1" />
          </div>
          <div style="display:flex; align-items:end; gap:8px;">
            <button class="ok" onclick="registrarMovimiento('VENTA')">Vender (-)</button>
            <button class="warn" onclick="registrarMovimiento('ENTRADA')">Ingresar (+)</button>
          </div>
        </div>
      </div>

      <div id="boxNuevo" class="card" style="display:none;">
        <h3 style="margin:0 0 8px 0;">Registrar Producto Nuevo</h3>
        <div class="row">
          <div><label>Código / Barras</label><input id="newCodigo" type="text" /></div>
          <div>
            <label>Categoría</label>
            <select id="newCategoria">
              <option>Accesorios</option>
              <option>Repuestos</option>
              <option>Insumos Taller</option>
              <option>Servicios</option>
            </select>
          </div>
          <div><label>Producto</label><input id="newNombre" type="text" placeholder="Ej: Vidrio Templado" /></div>
          <div><label>Modelo</label><input id="newModelo" type="text" placeholder="Ej: iPhone 13" /></div>
          <div><label>Precio Compra ($)</label><input id="newCompra" type="number" step="0.01" value="0" /></div>
          <div><label>Precio Venta ($)</label><input id="newVenta" type="number" step="0.01" value="0" /></div>
          <div><label>Stock Inicial</label><input id="newStock" type="number" value="1" /></div>
          <div><label>Stock Mínimo</label><input id="newMin" type="number" value="2" /></div>
        </div>
        <button class="ok" style="margin-top:10px;" onclick="guardarNuevoProducto()">Guardar en Inventario</button>
      </div>
    </section>

    <!-- PESTAÑA 2: INVENTARIO -->
    <section id="tab-inv" class="tab">
      <div class="card">
        <input id="filtroInv" type="text" placeholder="Buscar por nombre, modelo o código..." oninput="renderInventario()" />
      </div>
      <div class="card" id="listaInv"></div>
    </section>

    <!-- PESTAÑA 3: ESTADÍSTICAS Y MOVIMIENTOS -->
    <section id="tab-stats" class="tab">
      <div class="kpis" style="margin-bottom:12px;">
        <div class="kpi"><span>Ingresos Totales</span><strong id="kpiIngresos">$0.00</strong></div>
        <div class="kpi"><span>Unidades Vendidas</span><strong id="kpiVendidos">0</strong></div>
        <div class="kpi"><span>Productos en Stock</span><strong id="kpiStock">0</strong></div>
        <div class="kpi"><span>Alertas (Bajo / Agotado)</span><strong id="kpiAlertas">0</strong></div>
      </div>
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <h3 style="margin:0;">Últimos Movimientos</h3>
          <button class="sec" style="width:auto;" onclick="exportarCSV()">Exportar CSV</button>
        </div>
        <div id="listaMov"></div>
      </div>
    </section>
  </div>

  <nav class="bottom">
    <button id="btn-scan" class="active" onclick="cambiarTab('scan')">Escáner</button>
    <button id="btn-inv" onclick="cambiarTab('inv')">Inventario</button>
    <button id="btn-stats" onclick="cambiarTab('stats')">Estadísticas</button>
  </nav>

  <script>
    // =========================================================================
    // AQUÍ ES DONDE DEBES PEGAR TU URL DE GOOGLE APPS SCRIPT (TERMINADA EN /exec)
    // =========================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbxX1qRgbxvGZ_5OGWu-iI-p2vT6chDEFFHILleQQqW4bqILCDiZ8ZUasNI8OJFg8Etk/exec";

    let productos = [];
    let movimientos = [];
    let productoActual = null;
    let html5QrCode = null;

    function cambiarTab(tab) {
      document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
      document.querySelectorAll("nav.bottom button").forEach(el => el.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("active");
      document.getElementById("btn-" + tab).classList.add("active");
      if (tab !== "scan") detenerCamara();
      renderTodo();
    }

    function guardarLocal() {
      localStorage.setItem("astro_productos", JSON.stringify(productos));
      localStorage.setItem("astro_movimientos", JSON.stringify(movimientos));
    }

    function cargarLocal() {
      productos = JSON.parse(localStorage.getItem("astro_productos") || "[]");
      movimientos = JSON.parse(localStorage.getItem("astro_movimientos") || "[]");
      renderTodo();
    }

    async function cargarNube() {
      cargarLocal();
      if (!API_URL || API_URL.includes("https://script.google.com/macros/s/AKfycbxX1qRgbxvGZ_5OGWu-iI-p2vT6chDEFFHILleQQqW4bqILCDiZ8ZUasNI8OJFg8Etk/exec")) {
        document.getElementById("syncStatus").textContent = "https://script.google.com/macros/s/AKfycbxX1qRgbxvGZ_5OGWu-iI-p2vT6chDEFFHILleQQqW4bqILCDiZ8ZUasNI8OJFg8Etk/exec";
        return;
      }
      try {
        document.getElementById("syncStatus").textContent = "Sincronizando con Google Sheets...";
        const res = await fetch(API_URL);
        const data = await res.json();
        if (data.ok) {
          productos = (data.productos || []).map(p => ({
            codigo: String(p.codigo || "").trim(),
            categoria: p.categoria || "Accesorios",
            nombre: p.nombre || "",
            modelo: p.modelo || "",
            precio_compra: Number(p.precio_compra || 0),
            precio_venta: Number(p.precio_venta || 0),
            stock_inicial: Number(p.stock_inicial || 0),
            stock_minimo: Number(p.stock_minimo || 0)
          }));
          movimientos = (data.movimientos || []).map(m => ({
            fecha: m.fecha || "",
            dia: m.dia || "",
            codigo: String(m.codigo || "").trim(),
            producto: m.producto || "",
            tipo: m.tipo || "VENTA",
            cantidad: Number(m.cantidad || 0),
            total: Number(m.total || 0),
            stock_restante: Number(m.stock_restante || 0)
          }));
          guardarLocal();
          renderTodo();
          document.getElementById("syncStatus").textContent = "Sincronizado con Google Sheets";
        }
      } catch (e) {
        document.getElementById("syncStatus").textContent = "Sin conexión a la nube (usando respaldo local)";
      }
    }

    async function enviarNube(payload) {
      if (!API_URL || API_URL.includes("https://script.google.com/macros/s/AKfycbxX1qRgbxvGZ_5OGWu-iI-p2vT6chDEFFHILleQQqW4bqILCDiZ8ZUasNI8OJFg8Etk/exec")) return;
      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
      } catch (e) {
        console.error("Error enviando a nube:", e);
      }
    }

    function stockActual(codigo) {
      const p = productos.find(x => x.codigo === codigo);
      if (!p) return 0;
      let stock = Number(p.stock_inicial || 0);
      movimientos.forEach(m => {
        if (m.codigo === codigo) {
          if (m.tipo === "ENTRADA") stock += Number(m.cantidad || 0);
          if (m.tipo === "VENTA") stock -= Number(m.cantidad || 0);
        }
      });
      return stock;
    }

    function buscarCodigo(codigoDirecto) {
      const cod = String(codigoDirecto ?? document.getElementById("scanCode").value).trim();
      if (!cod) return;
      document.getElementById("scanCode").value = cod;

      const encontrado = productos.find(p => p.codigo === cod);
      if (encontrado) {
        productoActual = encontrado;
        const st = stockActual(cod);
        document.getElementById("boxExistente").style.display = "block";
        document.getElementById("boxNuevo").style.display = "none";
        document.getElementById("exNombre").textContent = `${encontrado.nombre} (${encontrado.codigo})`;
        document.getElementById("exInfo").textContent = `Modelo: ${encontrado.modelo || "-"} | Precio: $${encontrado.precio_venta.toFixed(2)} | Stock actual: ${st}`;
        document.getElementById("scanResultado").textContent = "Producto encontrado.";
      } else {
        productoActual = null;
        document.getElementById("boxExistente").style.display = "none";
        document.getElementById("boxNuevo").style.display = "block";
        document.getElementById("newCodigo").value = cod;
        document.getElementById("scanResultado").textContent = "Código nuevo: completa los datos para agregarlo.";
      }
    }

    async function guardarNuevoProducto() {
      const prod = {
        codigo: document.getElementById("newCodigo").value.trim(),
        categoria: document.getElementById("newCategoria").value,
        nombre: document.getElementById("newNombre").value.trim(),
        modelo: document.getElementById("newModelo").value.trim(),
        precio_compra: Number(document.getElementById("newCompra").value || 0),
        precio_venta: Number(document.getElementById("newVenta").value || 0),
        stock_inicial: Number(document.getElementById("newStock").value || 0),
        stock_minimo: Number(document.getElementById("newMin").value || 0)
      };
      if (!prod.codigo || !prod.nombre) {
        alert("Ingresa al menos el código y el nombre del producto.");
        return;
      }
      productos.push(prod);
      guardarLocal();
      renderTodo();
      await enviarNube({ accion: "guardar_producto", ...prod });
      document.getElementById("boxNuevo").style.display = "none";
      buscarCodigo(prod.codigo);
    }

    async function registrarMovimiento(tipo) {
      if (!productoActual) return;
      const cant = Number(document.getElementById("exCant").value || 0);
      if (cant <= 0) return;

      const ahora = new Date();
      const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
      const stAntes = stockActual(productoActual.codigo);
      const stDespues = tipo === "VENTA" ? stAntes - cant : stAntes + cant;
      const total = tipo === "VENTA" ? cant * Number(productoActual.precio_venta || 0) : cant * Number(productoActual.precio_compra || 0);

      const mov = {
        fecha: ahora.toLocaleDateString("es-EC"),
        dia: dias[ahora.getDay()],
        codigo: productoActual.codigo,
        producto: productoActual.nombre,
        tipo,
        cantidad: cant,
        total: Number(total.toFixed(2)),
        stock_restante: stDespues
      };

      movimientos.unshift(mov);
      guardarLocal();
      renderTodo();
      buscarCodigo(productoActual.codigo);
      await enviarNube({ accion: "registrar_movimiento", ...mov });
    }

    function badgeEstado(st, min) {
      if (st <= 0) return '<span class="badge b-out">AGOTADO</span>';
      if (st <= min * 1.5) return '<span class="badge b-low">POR AGOTARSE</span>';
      return '<span class="badge b-ok">DISPONIBLE</span>';
    }

    function renderInventario() {
      const q = (document.getElementById("filtroInv").value || "").toLowerCase();
      const cont = document.getElementById("listaInv");
      const filtrados = productos.filter(p =>
        p.codigo.toLowerCase().includes(q) ||
        p.nombre.toLowerCase().includes(q) ||
        (p.modelo || "").toLowerCase().includes(q)
      );
      if (!filtrados.length) {
        cont.innerHTML = "<p style='color:var(--muted)'>No hay productos registrados.</p>";
        return;
      }
      cont.innerHTML = filtrados.map(p => {
        const st = stockActual(p.codigo);
        return `<div class="item">
          <div>
            <strong>${p.nombre}</strong> <small>(${p.codigo})</small><br/>
            <small style="color:var(--muted)">${p.modelo || "-"} · $${p.precio_venta.toFixed(2)}</small>
          </div>
          <div style="text-align:right;">
            <strong>Stock: ${st}</strong><br/>
            ${badgeEstado(st, p.stock_minimo)}
          </div>
        </div>`;
      }).join("");
    }

    function renderEstadisticas() {
      let ingresos = 0, vendidos = 0;
      movimientos.forEach(m => {
        if (m.tipo === "VENTA") {
          ingresos += Number(m.total || 0);
          vendidos += Number(m.cantidad || 0);
        }
      });
      let stockTotal = 0, alertas = 0;
      productos.forEach(p => {
        const st = stockActual(p.codigo);
        stockTotal += st;
        if (st <= p.stock_minimo * 1.5) alertas++;
      });

      document.getElementById("kpiIngresos").textContent = "$" + ingresos.toFixed(2);
      document.getElementById("kpiVendidos").textContent = vendidos;
      document.getElementById("kpiStock").textContent = stockTotal;
      document.getElementById("kpiAlertas").textContent = alertas;

      const movCont = document.getElementById("listaMov");
      if (!movimientos.length) {
        movCont.innerHTML = "<p style='color:var(--muted)'>Sin movimientos aún.</p>";
        return;
      }
      movCont.innerHTML = movimientos.slice(0, 30).map(m => `
        <div class="item">
          <div>
            <strong>${m.tipo}</strong> · ${m.producto} (${m.cantidad} u.)<br/>
            <small style="color:var(--muted)">${m.fecha} (${m.dia}) · Stock restante: ${m.stock_restante}</small>
          </div>
          <strong>$${Number(m.total || 0).toFixed(2)}</strong>
        </div>
      `).join("");
    }

    function renderTodo() {
      renderInventario();
      renderEstadisticas();
    }

    function exportarCSV() {
      const filas = [["Fecha", "Dia", "Codigo", "Producto", "Tipo", "Cantidad", "Total", "StockRestante"]];
      movimientos.forEach(m => filas.push([m.fecha, m.dia, m.codigo, m.producto, m.tipo, m.cantidad, m.total, m.stock_restante]));
      const csv = filas.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "movimientos_astro_tech.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    async function iniciarCamara() {
      if (html5QrCode) return;
      html5QrCode = new Html5Qrcode("reader");
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 240, height: 140 } },
          (decodedText) => {
            detenerCamara();
            buscarCodigo(decodedText);
          }
        );
      } catch (err) {
        document.getElementById("scanResultado").textContent = "No se pudo abrir la cámara. Revisa permisos o escribe el código.";
        html5QrCode = null;
      }
    }

    async function detenerCamara() {
      if (html5QrCode) {
        try { await html5QrCode.stop(); await html5QrCode.clear(); } catch (e) {}
        html5QrCode = null;
      }
    }

    cargarNube();
  </script>
</body>
</html>
